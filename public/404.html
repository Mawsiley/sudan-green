<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>الصفحة غير موجودة — السودان الأخضر</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;600;700&display=swap" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      background: #060E09;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-family: 'IBM Plex Sans Arabic', sans-serif;
      color: #E8F5EC;
      text-align: center;
      padding: 2rem;
    }
    .code { font-size: 6rem; font-weight: 700; color: #2CC665; opacity: .12; line-height: 1; margin-bottom: 1rem; }
    h1 { font-size: 2rem; font-weight: 700; color: #2CC665; margin-bottom: .75rem; }
    p { color: #587A68; margin-bottom: 2rem; font-size: 1rem; }
    .btns { display: flex; gap: 1rem; flex-wrap: wrap; justify-content: center; }
    a.primary { padding: 10px 28px; background: #1A9A48; color: #fff; border-radius: 8px; text-decoration: none; font-weight: 600; font-size: 15px; }
    a.ghost { padding: 10px 28px; border: 1.5px solid rgba(44,198,101,.4); color: #2CC665; border-radius: 8px; text-decoration: none; font-weight: 600; font-size: 15px; }
    a:hover { opacity: .85; }
  </style>
</head>
<body>
  <div class="code">٤٠٤</div>
  <h1>الصفحة غير موجودة</h1>
  <p>تعذّر العثور على هذه الصفحة.</p>
  <div class="btns">
    <a class="primary" href="/">الصفحة الرئيسية</a>
    <a class="ghost" href="/auth">تسجيل الدخول</a>
  </div>
</body>
</html>
